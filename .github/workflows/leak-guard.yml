name: leak-guard

# Server-side backstop for the pre-push hook: the hook only exists in a clone that
# had scripts/install-hooks.sh run in it, so a fresh clone publishes unchecked.
# This runs the same scanner (scripts/leak-scan.sh) on every push and PR.
#
# Per-repo settings are baked into the env block below:
#   WHITELIST      path prefixes whose added lines are never judged
#   FILTER_AUTHOR  judge only commits with this author email (set on forks that
#                  also carry upstream commits)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: added lines for local paths and credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan added lines
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WHITELIST: ''
          FILTER_AUTHOR: ''
        run: |
          set -eu
          zero=0000000000000000000000000000000000000000
          if [ -n "${PR_BASE_SHA:-}" ] && [ "$PR_BASE_SHA" != "$zero" ]; then
            range="$PR_BASE_SHA...$HEAD_SHA"
          elif [ -n "${BASE_SHA:-}" ] && [ "$BASE_SHA" != "$zero" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            range=""
          fi

          if [ -n "$range" ]; then
            echo "range: $range"
            exec sh scripts/leak-scan.sh range "$range"
          fi

          # New branch, or a first push with no `before` to diff against. Judge what
          # the remote does not already have -- the same rule the pre-push hook uses
          # (`git rev-list "$local_sha" --not --remotes`).
          #
          # This used to be `git rev-list --no-merges -n 200`, which on a branch cut
          # from main reached back through commits that were already published, so the
          # first push of every branch failed on history it had not created.
          #
          # If --remotes resolves to nothing (no remote-tracking refs fetched), this
          # falls back to the whole history: noisy, but never quieter than before.
          echo "new branch or first push: judging commits the remote does not have"
          if ! shas=$(git rev-list --no-merges "$HEAD_SHA" --not --remotes); then
            echo "rev-list failed; refusing to judge" >&2
            exit 1
          fi
          if [ -z "$shas" ]; then
            # Nothing unpushed means nothing new is being published -- a tag on an
            # already-pushed commit, for instance. The hook lets this through too.
            echo "no unpushed commits: nothing to judge"
            exit 0
          fi
          # shellcheck disable=SC2086
          exec sh scripts/leak-scan.sh commits $shas

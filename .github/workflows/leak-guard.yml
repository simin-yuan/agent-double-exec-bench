name: leak-guard

# Server-side backstop for the pre-push hook: the hook only exists in a clone that
# had scripts/install-hooks.sh run in it, so a fresh clone publishes unchecked.
# This runs the same scanner (scripts/leak-scan.sh) on every push and PR.
#
# Per-repo settings are baked into the env block below:
#   WHITELIST      path prefixes whose added lines are never judged
#   FILTER_AUTHOR  judge only commits with this author email (set on forks that
#                  also carry upstream commits)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: added lines for local paths and credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan added lines
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WHITELIST: ''
          FILTER_AUTHOR: ''
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          zero=0000000000000000000000000000000000000000
          if [ -n "${PR_BASE_SHA:-}" ] && [ "$PR_BASE_SHA" != "$zero" ]; then
            range="$PR_BASE_SHA...$HEAD_SHA"
          elif [ -n "${BASE_SHA:-}" ] && [ "$BASE_SHA" != "$zero" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            range=""
          fi

          if [ -n "$range" ]; then
            echo "range: $range"
            exec sh scripts/leak-scan.sh range "$range"
          fi

          # New branch, or a first push with no `before` to diff against. Judge the
          # commits this branch adds on top of the default branch.
          #
          # Two wrong answers came before this one, both found by reading the logs:
          #
          #   -n 200 (original)
          #     Walked back through published history, so the first push of every
          #     branch failed on commits it had not created. Run 41864928618.
          #
          #   --not --remotes (intermediate)
          #     On a push event, actions/checkout fetches the branch being pushed, so
          #     the just-pushed commit is reachable from a remote-tracking ref and the
          #     list comes back EMPTY -- the gate reports clean without scanning
          #     anything. Run 41871994606 printed "no unpushed commits" and exited 0
          #     on a branch that carried a real commit. A green that means nothing is
          #     worse than a red that means nothing.
          #
          # The base that works is the default branch: a branch push adds exactly the
          # commits main does not have.
          BASE_REF=""
          if [ -n "${DEFAULT_BRANCH:-}" ] && git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH" >/dev/null 2>&1; then
            BASE_REF="origin/$DEFAULT_BRANCH"
          fi
          echo "new branch or first push: judging commits not in ${BASE_REF:-<whole history>}"
          if [ -n "$BASE_REF" ]; then
            if ! shas=$(git rev-list --no-merges "$HEAD_SHA" --not "$BASE_REF"); then
              echo "rev-list failed; refusing to judge" >&2
              exit 1
            fi
          else
            # No resolvable default branch: judge everything. Noisy rather than blind.
            echo "warning: cannot resolve origin/$DEFAULT_BRANCH, judging all history" >&2
            if ! shas=$(git rev-list --no-merges "$HEAD_SHA"); then
              echo "rev-list failed; refusing to judge" >&2
              exit 1
            fi
          fi
          if [ -z "$shas" ]; then
            # Only reachable when the branch has nothing main lacks -- a tag on an
            # already-merged commit, for instance. Never on a branch with work on it.
            echo "no commits ahead of ${BASE_REF:-<none>}: nothing to judge"
            exit 0
          fi
          # shellcheck disable=SC2086
          exec sh scripts/leak-scan.sh commits $shas
